<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>محسن الـPrompt بالذكاء الاصطناعي | AI بالعربي</title>

  <meta name="description" content="حسّن الـPrompt الخاص بك باستخدام الذكاء الاصطناعي واحصل على صياغة أوضح وأكثر دقة.">

  <link rel="stylesheet" href="style.css">

  <style>
    .prompt-tool {
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .prompt-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .prompt-header h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .prompt-header p {
      color: #666;
      line-height: 1.8;
    }

    .prompt-box {
      background: #fff;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.07);
    }

    .prompt-box label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #promptInput {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.7;
      box-sizing: border-box;
      outline: none;
    }

    #promptInput:focus {
      border-color: #2563eb;
    }

    .optimize-btn {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-family: inherit;
      cursor: pointer;
      transition: 0.2s;
    }

    .optimize-btn:hover {
      background: #1d4ed8;
    }

    .optimize-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-size: 15px;
    }

    .result-box {
      display: none;
      margin-top: 25px;
      background: #fff;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.07);
    }

    .result-box h2 {
      margin-top: 0;
      font-size: 22px;
    }

    #resultText {
      white-space: pre-wrap;
      line-height: 1.9;
      background: #f5f7fa;
      border-radius: 10px;
      padding: 18px;
      font-size: 16px;
    }

    .copy-btn {
      margin-top: 12px;
      padding: 11px 18px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-family: inherit;
      cursor: pointer;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #2563eb;
      text-decoration: none;
    }

    /* Dark mode */
    body.dark-mode .prompt-box,
    body.dark-mode .result-box {
      background: #1f2937;
      color: #fff;
    }

    body.dark-mode .prompt-header p {
      color: #d1d5db;
    }

    body.dark-mode #promptInput {
      background: #111827;
      color: #fff;
      border-color: #374151;
    }

    body.dark-mode #resultText {
      background: #111827;
      color: #fff;
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <a href="index.html" style="text-decoration:none; color:inherit;">
        <h1>AI بالعربي</h1>
      </a>

      <nav>
        <a href="index.html">الرئيسية</a>
        <a href="articles.html">المقالات</a>
        <button id="darkModeToggle" type="button">🌙</button>
      </nav>
    </div>
  </header>

  <main class="prompt-tool">

    <section class="prompt-header">
      <h1>محسّن الـPrompt 🤖</h1>

      <p>
        اكتب الـPrompt الخاص بك، ودع الذكاء الاصطناعي يساعدك
        على تحسينه وجعله أكثر وضوحًا ودقة للحصول على نتائج أفضل.
      </p>
    </section>

    <section class="prompt-box">

      <label for="promptInput">اكتب الـPrompt هنا</label>

      <textarea
        id="promptInput"
        placeholder="مثال: اكتب لي مقال عن الذكاء الاصطناعي..."
      ></textarea>

      <button
        id="optimizeButton"
        class="optimize-btn"
        type="button"
      >
        ✨ تحسين الـPrompt
      </button>

      <div id="status" class="status"></div>

    </section>

    <section id="resultBox" class="result-box">

      <h2>الـPrompt المحسّن</h2>

      <div id="resultText"></div>

      <button id="copyButton" class="copy-btn" type="button">
        📋 نسخ الـPrompt
      </button>

    </section>

    <a class="back-home" href="index.html">
      ← العودة إلى الرئيسية
    </a>

  </main>

  <script>

    // رابط Cloudflare Worker
    const WORKER_URL =
      "https://ai-prompt-optimizer.khelmy627.workers.dev/";

    const promptInput =
      document.getElementById("promptInput");

    const optimizeButton =
      document.getElementById("optimizeButton");

    const status =
      document.getElementById("status");

    const resultBox =
      document.getElementById("resultBox");

    const resultText =
      document.getElementById("resultText");

    const copyButton =
      document.getElementById("copyButton");


    optimizeButton.addEventListener("click", async () => {

      const prompt = promptInput.value.trim();

      if (!prompt) {
        status.textContent = "من فضلك اكتب Prompt أولًا.";
        return;
      }

      optimizeButton.disabled = true;
      optimizeButton.textContent = "⏳ جاري تحسين الـPrompt...";
      status.textContent = "";
      resultBox.style.display = "none";

      try {

        const response = await fetch(WORKER_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            prompt: prompt
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "حدث خطأ أثناء معالجة الطلب."
          );
        }

        if (!data.result) {
          throw new Error(
            "لم يتم الحصول على نتيجة من الذكاء الاصطناعي."
          );
        }

        resultText.textContent = data.result;

        resultBox.style.display = "block";

        status.textContent = "تم تحسين الـPrompt بنجاح ✅";

        resultBox.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      } catch (error) {

        console.error(error);

        status.textContent =
          "حدث خطأ أثناء الاتصال بالخدمة. حاول مرة أخرى.";

      } finally {

        optimizeButton.disabled = false;
        optimizeButton.textContent = "✨ تحسين الـPrompt";

      }

    });


    copyButton.addEventListener("click", async () => {

      const text = resultText.textContent;

      if (!text) return;

      try {

        await navigator.clipboard.writeText(text);

        copyButton.textContent = "تم النسخ ✅";

        setTimeout(() => {
          copyButton.textContent = "📋 نسخ الـPrompt";
        }, 2000);

      } catch {

        copyButton.textContent = "تعذر النسخ";

      }

    });


    // Dark Mode
    const darkModeToggle =
      document.getElementById("darkModeToggle");

    if (localStorage.getItem("darkMode") === "enabled") {
      document.body.classList.add("dark-mode");
    }

    if (darkModeToggle) {

      darkModeToggle.addEventListener("click", () => {

        document.body.classList.toggle("dark-mode");

        if (
          document.body.classList.contains("dark-mode")
        ) {
          localStorage.setItem(
            "darkMode",
            "enabled"
          );
        } else {
          localStorage.removeItem("darkMode");
        }

      });

    }

  </script>

</body>
  </html>
